<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>릴레이 이어쓰기 ✏️</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>
<div class="topbar">
  <a href="index.html">‹ 팀 선택</a>
  <span class="logo" id="teamTitle">🏃 릴레이 이어쓰기</span>
  <span class="spacer"></span>
  <span class="savestate" id="saveState"></span>
</div>
<div class="wrap">
  <div id="turnBanner"></div>
  <p id="notice" class="notice" hidden></p>
  <div id="panels"><p class="note center">불러오는 중…</p></div>
</div>
<div class="savebar">
  <div class="prog">
    <div class="ptxt" id="progTxt">완성 0컷</div>
    <div class="pbar"><i id="progBar" style="width:0%"></i></div>
  </div>
  <button class="btn" id="submitBtn">다음 팀에게 넘기기 ➡️</button>
</div>
<script>
const team = parseInt(new URLSearchParams(location.search).get('team') || '0', 10);
if (!team || team < 1) location.href = 'index.html';

const data = {}; // "p_b" -> text
const timers = {}; // 칸별 디바운스 타이머 (공용 1개면 다른 칸 입력이 저장을 취소해버림)
const saveState = document.getElementById('saveState');
let N = 8, PC = PANELS.length;
let relay = null, lastSig = '', lastEpoch = 0;

function key(p, b) { return p + '_' + b; }
function myChunk() { return teamChunk(team, N, PC); }
function isMyTurn() { return !!(relay && !relay.complete && relay.currentTeam === team); }
function sigOf(st) { return N + '|' + PC + '|' + st.done.join('') + '|' + st.currentPanel; }
function scrollToMyChunk() { // 자기 구간의 첫 컷이 화면 바로 위에 오게
  const ch = myChunk();
  if (!ch) return;
  const fig = document.getElementById('panel-' + ch.start);
  if (fig) fig.scrollIntoView({ behavior: 'auto', block: 'start' });
}

function updateProg() {
  const c = relay ? relay.doneCount : 0;
  let cur = '';
  if (relay && !relay.complete && relay.currentChunk) {
    const ch = relay.currentChunk;
    let f = 0;
    for (let p = ch.start; p <= ch.end; p++) for (let b = 0; b < 2; b++) if ((data[key(p, b)] || '').trim()) f++;
    cur = ' · 이 차례 ' + f + '/' + (ch.size * 2) + '개';
  }
  document.getElementById('progTxt').textContent = '완성 ' + c + '/' + PC + '컷' + cur;
  document.getElementById('progBar').style.width = Math.round(c / PC * 100) + '%';
}

async function doSave(p, b, text) {
  try {
    await api('webtoon_bubbles', {
      method: 'POST',
      headers: Object.assign({}, H, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
      body: JSON.stringify({ team_no: RELAY_TEAM, panel_idx: p, bubble_idx: b, text: text })
    });
    saveState.textContent = '저장됨 ✓';
  } catch (e) { saveState.textContent = '저장 실패 ⚠️'; }
}
function queueSave(p, b, text) {
  const k = key(p, b);
  data[k] = text;
  document.getElementById('notice').hidden = true; // 입력이 시작되면 오래된 안내 문구를 치움
  updateProg();
  saveState.textContent = '저장 중…';
  clearTimeout(timers[k]);
  timers[k] = setTimeout(() => doSave(p, b, text), 700);
}
function flushSave(p, b) { // 포커스가 벗어나면 대기 중인 저장을 즉시 실행
  const k = key(p, b);
  if (timers[k]) { clearTimeout(timers[k]); delete timers[k]; doSave(p, b, data[k] || ''); }
}
function flushAll() {
  Object.keys(timers).forEach(k => {
    clearTimeout(timers[k]);
    const parts = k.split('_');
    doSave(+parts[0], +parts[1], data[k] || '');
    delete timers[k];
  });
}

async function loadRelay() {
  relay = await getRelayState(N, PC);
  const m = await getRelayBubbles();
  Object.keys(data).forEach(k => delete data[k]);
  Object.assign(data, m);
  renderRelay();
}

function renderRelay() {
  lastSig = sigOf(relay);
  const banner = document.getElementById('turnBanner');
  const wrap = document.getElementById('panels');
  const btn = document.getElementById('submitBtn');
  const noChunk = !myChunk();
  if (relay.complete) {
    banner.innerHTML = '<div class="turn-banner done">🎉 릴레이 완성! ' + PC + '컷 모두 이어졌어요.</div>';
  } else if (isMyTurn()) {
    banner.innerHTML = '<div class="turn-banner now">✍️ 우리 팀 차례예요! <b>' + chunkLabel(team, N, PC) + '</b>의 말풍선을 채워주세요. 앞 컷 이야기를 보고 이어가면 돼요.</div>';
  } else if (noChunk) {
    banner.innerHTML = '<div class="turn-banner wait">⏳ 우리 팀은 맡은 구간이 없어요. 지금은 <b>' + relay.currentTeam + '팀</b> 차례예요 (' + chunkLabel(relay.currentTeam, N, PC) + ' 작성 중).</div>';
  } else {
    banner.innerHTML = '<div class="turn-banner wait">⏳ 지금은 <b>' + relay.currentTeam + '팀</b> 차례예요 (' + chunkLabel(relay.currentTeam, N, PC) + ' 작성 중). 우리 팀 차례가 되면 이 화면이 자동으로 열려요.</div>';
  }
  wrap.innerHTML = '';
  for (let p = 0; p < PC; p++) {
    const author = relayAuthor(p, N, PC);
    const inCur = !!(relay.currentChunk && p >= relay.currentChunk.start && p <= relay.currentChunk.end);
    const editable = isMyTurn() && inCur;
    const locked = !relay.done[p] && !inCur;
    let badge;
    if (relay.done[p]) badge = '✍️ ' + author + '팀';
    else if (inCur) badge = isMyTurn() ? '✍️ 우리 팀 작성 중' : '✍️ ' + author + '팀 작성 중…';
    else badge = author + '팀 차례 대기';
    const tmp = document.createElement('div');
    tmp.innerHTML = panelFigure(p, (b) => bubbleHTML(data[key(p, b)] || '', editable, p, b, locked ? '🔒 차례가 오면 열려요' : null), badge);
    const fig = tmp.firstChild;
    if (inCur) fig.classList.add('now');
    if (editable) {
      fig.querySelectorAll('textarea').forEach(ta => {
        ta.addEventListener('input', () => queueSave(+ta.dataset.p, +ta.dataset.b, ta.value));
        ta.addEventListener('blur', () => flushSave(+ta.dataset.p, +ta.dataset.b));
      });
    }
    wrap.appendChild(fig);
  }
  updateProg();
  armSubmit = false;
  btn.disabled = false;
  btn.classList.remove('teal');
  if (relay.complete) { btn.textContent = '결과 보기 📖'; }
  else if (isMyTurn()) { btn.textContent = '다음 팀에게 넘기기 ➡️'; }
  else if (noChunk) { btn.textContent = '차례 없음'; btn.disabled = true; }
  else { btn.textContent = '차례 대기 중…'; btn.disabled = true; }
}

async function pollRelay() {
  try {
    const n2 = await getTeamCount();
    const pc2 = await getPanelCount();
    if (team > n2) { location.href = 'index.html'; return; }
    const ep = await getResetEpoch();
    const st = await getRelayState(n2, pc2);
    const sig2 = n2 + '|' + pc2 + '|' + st.done.join('') + '|' + st.currentPanel;
    if (ep !== null && ep !== lastEpoch) { // 관리자가 초기화함: 저장하지 않고 로컬 초안을 버리고 서버 상태로 다시 그림
      lastEpoch = ep;
      Object.keys(timers).forEach(k => { clearTimeout(timers[k]); delete timers[k]; });
      N = n2; PC = pc2; relay = st;
      const m = await getRelayBubbles();
      Object.keys(data).forEach(k => delete data[k]);
      Object.assign(data, m);
      document.getElementById('notice').hidden = true;
      saveState.textContent = '';
      renderRelay();
      if (isMyTurn()) scrollToMyChunk();
      return;
    }
    if (sig2 !== lastSig) { // 차례·설정이 바뀐 경우에만 다시 그림 (입력 중 화면이 흔들리지 않게)
      flushAll();
      const wasMine = isMyTurn();
      N = n2; PC = pc2; relay = st;
      const m = await getRelayBubbles();
      Object.keys(data).forEach(k => delete data[k]);
      Object.assign(data, m);
      renderRelay();
      if (!wasMine && isMyTurn()) scrollToMyChunk(); // 차례가 오면 자기 구간으로 바로 이동
    }
  } catch (e) { /* 다음 폴링에서 다시 시도 */ }
}

(async function init() {
  N = await getTeamCount();
  PC = await getPanelCount();
  if (team > N) { location.href = 'index.html'; return; }
  document.getElementById('teamTitle').textContent = '🏃 ' + team + '팀 릴레이 이어쓰기';
  await loadRelay();
  lastEpoch = (await getResetEpoch()) || 0;
  scrollToMyChunk(); // 들어가자마자 자기 구간이 바로 보이게
  setInterval(pollRelay, 3000);
})();

// 두 단계 확인 넘기기 (모바일/자동화 브라우저에서 confirm()이 불안정해서 인라인 확인)
let armSubmit = false, armTimer = null;
document.getElementById('submitBtn').addEventListener('click', async function () {
  const btn = this;
  if (relay.complete) { location.href = 'result.html'; return; }
  if (!isMyTurn()) return;
  const ch = myChunk();
  let filled = 0, firstEmpty = -1;
  for (let p = ch.start; p <= ch.end; p++) {
    for (let b = 0; b < 2; b++) {
      if ((data[key(p, b)] || '').trim()) filled++;
      else if (firstEmpty < 0) firstEmpty = p;
    }
  }
  const total = ch.size * 2;
  if (filled < total) {
    const notice = document.getElementById('notice');
    notice.textContent = '맡은 구간의 말풍선을 다 채워주세요 🙂 (지금 ' + filled + '/' + total + '개)';
    notice.hidden = false;
    const fig = document.getElementById('panel-' + firstEmpty);
    if (fig) fig.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  document.getElementById('notice').hidden = true;
  if (!armSubmit) {
    armSubmit = true;
    btn.textContent = '정말 넘길까요? 다시 눌러주세요';
    btn.classList.add('teal');
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { armSubmit = false; btn.textContent = '다음 팀에게 넘기기 ➡️'; btn.classList.remove('teal'); }, 8000);
    return;
  }
  clearTimeout(armTimer);
  btn.disabled = true; btn.textContent = '넘기는 중…';
  flushAll();
  try {
    const jobs = [];
    for (let p = ch.start; p <= ch.end; p++) {
      jobs.push(api('webtoon_teams', {
        method: 'POST',
        headers: Object.assign({}, H, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
        body: JSON.stringify({ team_no: MARKER_BASE + p, submitted: true })
      }));
    }
    await Promise.all(jobs);
    location.href = 'index.html';
  } catch (e) {
    alert('넘기기에 실패했어요. 다시 시도해주세요.');
    btn.disabled = false; btn.textContent = '다음 팀에게 넘기기 ➡️'; armSubmit = false;
  }
});
</script>
</body>
</html>
